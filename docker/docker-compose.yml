version: '3.8'

services:
  # Central Warehouse (existing system)
  postgres-cwh:
    image: postgres:16-alpine
    container_name: central_warehouse
    environment:
      POSTGRES_DB: central_warehouse
      POSTGRES_USER: cwh_user
      POSTGRES_PASSWORD: cwh_pass
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-cwh/init.sql:/docker-entrypoint-initdb.d/init.sql
      - cwh_data:/var/lib/postgresql/data
    networks:
      - datamart_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cwh_user -d central_warehouse"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Data Mart (generation target)
  postgres-dm:
    image: postgres:16-alpine
    container_name: data_mart
    environment:
      POSTGRES_DB: data_mart
      POSTGRES_USER: dm_user
      POSTGRES_PASSWORD: dm_pass
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5433:5432"
    volumes:
      - ./postgres-dm/init.sql:/docker-entrypoint-initdb.d/init.sql
      - dm_data:/var/lib/postgresql/data
    networks:
      - datamart_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dm_user -d data_mart"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgvector (Metadata Vector DB)
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: metadata_vector_db
    environment:
      POSTGRES_DB: metadata_db
      POSTGRES_USER: vector_user
      POSTGRES_PASSWORD: vector_pass
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5434:5432"
    volumes:
      - ./pgvector/init.sql:/docker-entrypoint-initdb.d/init.sql
      - vector_data:/var/lib/postgresql/data
    networks:
      - datamart_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vector_user -d metadata_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ollama (LLM inference engine)
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_llm
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - datamart_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  datamart_network:
    driver: bridge

volumes:
  cwh_data:
  dm_data:
  vector_data:
  ollama_models:
